minimum_pre_commit_version: '4.6.2'
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-added-large-files
        args: [--maxkb=500]
        # Bundled upstream catalogs and the impeccable browser bundle exceed the default size limit.
        exclude: '^\.(agents|claude)/skills/(ui-ux-pro-max/data/(google-fonts\.csv|phosphor-icons-upstream\.json)|impeccable/scripts/(data/font-index\.json|live-browser\.js))$'
      # CI has no staged additions: inspect committed files after checkout too.
      - id: check-added-large-files
        alias: check-all-large-files
        stages: [manual]
        args: [--maxkb=500, --enforce-all]
        exclude: '^\.(agents|claude)/skills/(ui-ux-pro-max/data/(google-fonts\.csv|phosphor-icons-upstream\.json)|impeccable/scripts/(data/font-index\.json|live-browser\.js))$'
      - id: detect-private-key
  - repo: local
    hooks:
      - id: commitlint
        name: Validate Conventional Commit message
        entry: commitlint --strict --edit
        language: node
        language_version: '24.21.0'
        additional_dependencies: ['@commitlint/cli@21.2.3', '@commitlint/config-conventional@21.2.3']
        stages: [commit-msg]
