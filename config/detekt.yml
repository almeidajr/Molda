config:
  validation: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable', 'Test']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
    # Hoisted Compose state passes values in and one lambda per event out.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  # Enable inactive rules that mirror Android Studio's redundancy inspections.
  UnusedImport:
    active: true
  UnnecessaryFullyQualifiedName:
    active: true
  UnnecessaryBackticks:
    active: true
  UnnecessaryBracesAroundTrailingLambda:
    active: true
  UnnecessaryInnerClass:
    active: true
  UnnecessaryLet:
    active: true
  UnnecessaryParentheses:
    active: true
  RedundantExplicitType:
    active: true
  # These two stand in for compiler checks app/build.gradle.kts disables for Room's code.
  RedundantVisibilityModifier:
    active: true
  VarCouldBeVal:
    active: true
  # Tests synchronize instead of sleeping; see .agents/rules/kotlin-tests.md.
  ForbiddenMethodCall:
    active: true
    includes: ['**/test/**', '**/testFixtures/**', '**/androidTest/**']
    methods:
      - reason: 'Fixed sleeps make tests slow and flaky. Synchronize instead; see .agents/rules/kotlin-tests.md.'
        value: 'java.lang.Thread.sleep'
      - reason: 'Fixed sleeps make tests slow and flaky. Synchronize instead; see .agents/rules/kotlin-tests.md.'
        value: 'android.os.SystemClock.sleep'
      - reason: 'Blocking on a latch waits on wall-clock time. Synchronize instead; see .agents/rules/kotlin-tests.md.'
        value: 'java.util.concurrent.CountDownLatch.await'
  # One assertion library; see .agents/rules/kotlin-tests.md.
  ForbiddenImport:
    active: true
    includes: ['**/test/**', '**/testFixtures/**', '**/androidTest/**']
    forbiddenImports:
      - reason: 'Assert with kotlin.test; see .agents/rules/kotlin-tests.md.'
        value: 'org.junit.Assert*'
