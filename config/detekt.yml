config:
  validation: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable', 'Test']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*'

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
    # Hoisted Compose state passes values in and one lambda per event out.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  # Enable inactive rules that mirror Android Studio's redundancy inspections.
  UnusedImport:
    active: true
  UnnecessaryFullyQualifiedName:
    active: true
  UnnecessaryBackticks:
    active: true
  UnnecessaryBracesAroundTrailingLambda:
    active: true
  UnnecessaryInnerClass:
    active: true
  UnnecessaryLet:
    active: true
  UnnecessaryParentheses:
    active: true
  RedundantExplicitType:
    active: true
  # These two stand in for compiler checks app/build.gradle.kts disables for Room's code.
  RedundantVisibilityModifier:
    active: true
  VarCouldBeVal:
    active: true
