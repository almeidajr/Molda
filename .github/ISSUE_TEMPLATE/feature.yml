name: Feature idea
description: A new pattern, guide or change that would help your sewing.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/almeidajr/Molda/blob/main/docs/roadmap.md) and existing issues first; your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: The sewing problem
      description: What you were trying to do and what got in the way. A real situation beats a hypothetical one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like Molda to do
      description: The behaviour you have in mind, as concretely as you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you handle it today
      description: Paper, other apps, references or workarounds you use instead.
