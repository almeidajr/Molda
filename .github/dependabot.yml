version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      android-build-tools:
        patterns:
          - com.android.*
          - org.jetbrains.kotlin*
        update-types: [minor, patch]
      androidx:
        patterns: ['androidx.*']
        update-types: [minor, patch]
      quality-tools:
        patterns: ['com.diffplug.spotless*', 'dev.detekt*', 'com.pinterest.ktlint*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
