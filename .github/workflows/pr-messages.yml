name: PR messages

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-messages-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  messages:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: PR title
            mode: title
          - check: PR commits
            mode: commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only the trusted default-branch configuration is checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: commitlint.config.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Install pinned commitlint tooling
        run: npm install --prefix "$RUNNER_TEMP/commitlint" --no-save --package-lock=false @commitlint/cli@21.2.3 @commitlint/config-conventional@21.2.3
      - name: Validate metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          VALIDATION_MODE: ${{ matrix.mode }}
        run: |
          export NODE_PATH="$RUNNER_TEMP/commitlint/node_modules"
          validator="$RUNNER_TEMP/commitlint/node_modules/.bin/commitlint"
          endpoint="repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          snapshot=$(gh api "$endpoint" --jq '[.base.sha, .head.sha, .commits] | @tsv')
          IFS=$'\t' read -r base head count <<< "$snapshot"
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ && "$count" =~ ^[1-9][0-9]*$ ]]
          [[ "$base" == "$EXPECTED_BASE" && "$head" == "$EXPECTED_HEAD" ]] || { echo 'PR changed; rerun validation.'; exit 1; }
          if [[ "$VALIDATION_MODE" == commits ]]; then
            # Fetch Git objects for messages only; never check out the PR tree.
            git fetch --no-tags --no-recurse-submodules origin "$base" "$head"
            [[ "$(git rev-parse --is-shallow-repository)" == false ]]
            [[ "$(git rev-list --count "$base..$head")" == "$count" ]] || { echo 'Incomplete PR commit range; validation failed.'; exit 1; }
          else
            [[ "$(gh api "$endpoint" --jq .title)" == "$PR_TITLE" ]] || { echo 'PR title changed; rerun validation.'; exit 1; }
          fi
          # commitlint prints messages; disable GitHub commands while displaying them.
          command_token=$(openssl rand -hex 32)
          echo "::stop-commands::$command_token"
          result=0
          if [[ "$VALIDATION_MODE" == title ]]; then
            printf '%s\n' "$PR_TITLE" | "$validator" --strict --config commitlint.config.cjs || result=$?
          else
            "$validator" --strict --config commitlint.config.cjs --from "$base" --to "$head" || result=$?
          fi
          echo "::$command_token::"
          [[ "$(gh api "$endpoint" --jq '[.base.sha, .head.sha, .commits] | @tsv')" == "$snapshot" ]] || { echo 'PR changed during validation; rerun.'; exit 1; }
          if [[ "$VALIDATION_MODE" == title ]]; then
            [[ "$(gh api "$endpoint" --jq .title)" == "$PR_TITLE" ]] || { echo 'PR title changed during validation; rerun.'; exit 1; }
          fi
          exit "$result"
