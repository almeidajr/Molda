name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.0'
      - name: Check repository hygiene
        run: |
          uvx --python 3.12 pre-commit@4.6.2 run --all-files --show-diff-on-failure
          uvx --python 3.12 pre-commit@4.6.2 run check-all-large-files --hook-stage manual --all-files
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          # Lets setup-gradle save and restore the configuration cache, which can hold secrets.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Robolectric fetches its Android jars into ~/.m2, which setup-gradle does not cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Check formatting, analysis, tests, and debug build
        run: bash ./gradlew spotlessCheck :app:detektMain :app:detektTest :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --continue
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: app/build/reports/
          retention-days: 7

  device-tests:
    name: Device tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A pull request that touches only docs or agent files skips the emulator; the job still
      # succeeds, so the required check passes. Pushes to main always run.
      - name: Check for app changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          not_app='^(docs/|animations/|\.agents/|\.claude/|\.impeccable/|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'
          if git diff --name-only "$BASE_SHA" HEAD | grep -qvE "$not_app"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.changes.outputs.app != 'false'
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.changes.outputs.app != 'false'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.changes.outputs.app != 'false'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          # Lets setup-gradle save and restore the configuration cache, which can hold secrets.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Enable KVM access
        if: steps.changes.outputs.app != 'false'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device tests
        if: steps.changes.outputs.app != 'false'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # API 36's newest image (rev 7) crashes now and then in libhwui's AnimatorManager::pushStaging
          # (AOSP bug 327666562), killing the test process. AOSP has fixed it; API 37 runs clean.
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          profile: pixel_9
          ram-size: 4096M
          disable-animations: false
          script: bash ./gradlew :app:connectedDebugAndroidTest
      - name: Upload device test reports
        if: ${{ !cancelled() && steps.changes.outputs.app != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-reports
          # The XML results carry per-test times.
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
