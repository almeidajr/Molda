name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/molda.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_FILE"
          bash ./gradlew :app:assembleRelease \
            -PversionName="${GITHUB_REF_NAME#v}" \
            -PversionCode="$GITHUB_RUN_NUMBER"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Without signing, AGP names the APK app-release-unsigned.apk, so this cp fails instead of publishing it.
        run: |
          cp app/build/outputs/apk/release/app-release.apk "molda-$GITHUB_REF_NAME.apk"
          # A semver suffix (v1.0.0-beta.1) marks a beta build.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "molda-$GITHUB_REF_NAME.apk" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}"
